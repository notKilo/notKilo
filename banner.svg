<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#eeecf6"/><stop offset=".4" stop-color="#ff8fb1"/><stop offset=".7" stop-color="#7c6cff"/><stop offset="1" stop-color="#8fe3ff"/></linearGradient>
<clipPath id="r"><rect width="1200" height="300" rx="28"/></clipPath>
</defs>
<style>
.o1{animation:a 14s ease-in-out infinite}
.o2{animation:b 18s ease-in-out infinite}
.o3{animation:c 16s ease-in-out infinite}
@keyframes a{50%{transform:translate(180px,40px)}}
@keyframes b{50%{transform:translate(-200px,-30px)}}
@keyframes c{50%{transform:translate(120px,-50px)}}
.n{font-family:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;font-size:84px;letter-spacing:-2px}
.s{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:20px;fill:#b9b7cc;letter-spacing:.3px}
</style>
<g clip-path="url(#r)">
<rect width="1200" height="300" fill="#0c0d16"/>
<g filter="url(#b)" opacity=".85">
<circle class="o1" cx="220" cy="80" r="170" fill="#7c6cff"/>
<circle class="o2" cx="980" cy="120" r="160" fill="#ff8fb1" opacity=".75"/>
<circle class="o3" cx="620" cy="300" r="170" fill="#8fe3ff" opacity=".45"/>
</g>
<text x="70" y="160" class="n" fill="#eeecf6">Boris <tspan font-style="italic" fill="url(#t)">Rodnevski</tspan></text>
<text x="74" y="212" class="s">AI engineer  ·  New York City  ·  Senior at The Hun School of Princeton</text>
<text x="1130" y="262" text-anchor="end" class="s" style="font-size:15px;fill:#8d8ba3">borisrodnevski.com</text>
</g>
</svg>
